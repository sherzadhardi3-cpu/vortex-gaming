# ─── VORTEX GAMING — Render Blueprint Deployment Specification ─────────────────
# Documentation: https://render.com/docs/blueprint-spec
# Deploys a free Next.js 16 Web Service and linked PostgreSQL Database.

services:
  - type: web
    name: vortex-gaming-staging
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: APP_ENV
        value: staging
      - key: FORCE_SANDBOX
        value: "true"
      - key: NEXT_PUBLIC_APP_ENV
        value: staging
      - key: NEXT_PUBLIC_APP_NAME
        value: "VORTEX GAMING (Staging)"
      - key: DATABASE_URL
        fromDatabase:
          name: vortex-gaming-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: GAME_KEY_ENCRYPTION_KEY
        sync: false # Required secret managed in Render Dashboard: 64-character hex CSPRNG key
      - key: STRIPE_PUBLIC_KEY
        sync: false # Test mode key: pk_test_...
      - key: STRIPE_SECRET_KEY
        sync: false # Test mode key: sk_test_...
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # Test webhook secret: whsec_...
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_SUPPORT_CHANNEL_ID
        sync: false
      - key: DISCORD_ORDERS_CHANNEL_ID
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

databases:
  - name: vortex-gaming-db
    plan: free
    region: oregon
    databaseName: vortex_gaming
    user: vortex_user
