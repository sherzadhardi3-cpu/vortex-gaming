<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="vtxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark rounded container -->
  <rect width="48" height="48" rx="12" fill="#0a0a0f" />
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="url(#vtxGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Outer Cyber Hex / Vortex lines -->
  <path d="M24 6 L38 14 L38 30 L24 40 L10 30 L10 14 Z" stroke="url(#glowGrad)" stroke-width="2" fill="none" />

  <!-- VORTEX Energetic Glyph "V" -->
  <path d="M14 14 L24 34 L34 14 L29 14 L24 25 L19 14 Z" fill="url(#vtxGrad)" filter="url(#neonGlow)" />
  
  <!-- Central Energy Core -->
  <circle cx="24" cy="20" r="2.5" fill="#00d4ff" />
</svg>
